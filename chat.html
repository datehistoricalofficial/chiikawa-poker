<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Chat Log — Becca &amp; Sunny ☀️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --pink:      #ff69b4;
            --pink-light:#ffb6c1;
            --pink-pale: #fff0f5;
            --side-w:    220px;
            --top-h:     56px;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: #f0f0f0;
            overflow: hidden;
            height: 100vh;
        }

        .layout { display: flex; height: 100vh; }

        /* ─── SIDEBAR ─── */
        .sidebar {
            width: var(--side-w);
            background: linear-gradient(180deg, #ff69b4 0%, #ff8cc8 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar-logo {
            padding: 20px 20px 16px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,.3);
        }

        .sidebar-logo .sun {
            font-size: 32px;
            display: inline-block;
            animation: spin 10s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .sidebar-logo h2 { color: white; font-size: 15px; font-weight: 700; margin-top: 6px; letter-spacing: 1px; }
        .sidebar-logo p  { color: rgba(255,255,255,.75); font-size: 11px; margin-top: 3px; }

        .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
        .sidebar-nav::-webkit-scrollbar { width: 3px; }
        .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.3); border-radius: 2px; }

        /* Page nav links */
        .page-nav {
            border-bottom: 1px solid rgba(255,255,255,.25);
            padding-bottom: 8px;
            margin-bottom: 4px;
        }

        .page-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            color: rgba(255,255,255,.8);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: background .15s, padding-left .15s;
        }

        .page-link:hover { background: rgba(255,255,255,.15); color: white; padding-left: 22px; }
        .page-link.active { background: rgba(255,255,255,.2); color: white; border-right: 3px solid white; }
        .page-link .pi { font-size: 16px; width: 20px; text-align: center; }

        .month-group { margin-bottom: 2px; }

        .month-label {
            padding: 7px 16px;
            color: rgba(255,255,255,.65);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }

        .month-label:hover { color: rgba(255,255,255,.9); }
        .month-label .arrow { font-size: 10px; transition: transform .2s; }
        .month-label.collapsed .arrow { transform: rotate(-90deg); }

        .date-links.hidden { display: none; }

        .date-link {
            display: block;
            padding: 5px 16px 5px 26px;
            color: rgba(255,255,255,.75);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
        }

        .date-link:hover, .date-link.active { background: rgba(255,255,255,.18); color: white; }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid rgba(255,255,255,.3);
            text-align: center;
        }

        .sidebar-footer p { color: rgba(255,255,255,.75); font-size: 11px; line-height: 1.7; }

        /* ─── MAIN ─── */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* Top bar */
        .topbar {
            height: var(--top-h);
            background: white;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 14px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }

        .topbar-title { font-size: 16px; font-weight: 700; color: var(--pink); white-space: nowrap; }

        .search-wrap { flex: 1; max-width: 380px; position: relative; }

        .search-wrap input {
            width: 100%;
            padding: 7px 34px 7px 14px;
            border-radius: 20px;
            border: 2px solid #eee;
            font-size: 13px;
            outline: none;
            font-family: inherit;
            background: #f8f8f8;
            transition: border-color .2s, background .2s;
        }

        .search-wrap input:focus { border-color: var(--pink-light); background: white; }
        .search-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #ccc; font-size: 14px; }

        .msg-stats { color: #aaa; font-size: 12px; white-space: nowrap; }

        /* Chat area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px 20px 32px;
            scroll-behavior: smooth;
        }

        .chat-area::-webkit-scrollbar { width: 5px; }
        .chat-area::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
        .chat-area::-webkit-scrollbar-thumb:hover { background: var(--pink-light); }

        /* Date groups */
        .date-group { margin-bottom: 6px; }

        .date-sep {
            text-align: center;
            margin: 18px 0 10px;
            position: relative;
        }

        .date-sep::before {
            content: '';
            position: absolute;
            top: 50%; left: 0; right: 0;
            height: 1px;
            background: #e0e0e0;
        }

        .date-sep span {
            position: relative;
            background: #f0f0f0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #aaa;
            font-weight: 700;
            border: 1px solid #e0e0e0;
        }

        /* Message rows */
        .msg-row {
            display: flex;
            margin-bottom: 3px;
            align-items: flex-end;
            gap: 7px;
        }

        .msg-row.from-becca { flex-direction: row-reverse; }
        .msg-row.system     { justify-content: center; margin: 6px 0; }

        /* Avatar */
        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .avatar.av-sunny { background: linear-gradient(135deg, #ff69b4, #ff8cc8); }
        .avatar.av-becca { background: linear-gradient(135deg, #a855f7, #c084fc); }
        .msg-row.grouped .avatar { visibility: hidden; }

        /* Bubble wrap */
        .bw {
            max-width: 58%;
            display: flex;
            flex-direction: column;
        }

        .msg-row.from-becca .bw { align-items: flex-end; }

        .sender-lbl {
            font-size: 10px;
            color: #bbb;
            font-weight: 700;
            margin-bottom: 2px;
            padding-left: 4px;
        }

        .msg-row.from-becca .sender-lbl { padding-left: 0; padding-right: 4px; }
        .msg-row.grouped .sender-lbl { display: none; }

        /* Bubbles */
        .bubble {
            padding: 7px 11px;
            border-radius: 16px;
            font-size: 13.5px;
            line-height: 1.55;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .bubble.b-sunny {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,.07);
        }

        .bubble.b-becca {
            background: linear-gradient(135deg, #ff69b4, #ff8cc8);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 1px 6px rgba(255,105,180,.3);
        }

        .bubble a { color: inherit; opacity: .8; }
        .bubble.b-sunny a { color: var(--pink); }

        .btime {
            font-size: 10px;
            color: #c0c0c0;
            margin: 1px 4px 3px;
            align-self: flex-end;
        }

        /* Media chips */
        .media-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 9px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
        }

        .media-chip.photo   { background: rgba(59,130,246,.1);  color: #3b82f6; }
        .media-chip.video   { background: rgba(239,68,68,.1);   color: #ef4444; }
        .media-chip.sticker { background: rgba(245,158,11,.1);  color: #f59e0b; }
        .media-chip.file    { background: rgba(107,114,128,.1); color: #6b7280; }

        .bubble.b-becca .media-chip { background: rgba(255,255,255,.25); color: white; }

        /* Call / system */
        .call-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            background: white;
            border: 1px solid #e8e8e8;
        }

        .recalled-pill {
            font-size: 11px;
            color: #ccc;
            font-style: italic;
            padding: 3px 8px;
            border-radius: 8px;
            background: rgba(0,0,0,.04);
        }

        /* Highlight */
        mark { background: #ffe066; color: #333; border-radius: 2px; padding: 0 1px; }

        /* Loading & empty */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #aaa;
            gap: 10px;
        }

        .spinner {
            width: 22px; height: 22px;
            border: 3px solid var(--pink-light);
            border-top-color: var(--pink);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        .empty-msg { text-align: center; padding: 60px 20px; color: #bbb; font-size: 14px; }
    </style>
</head>
<body>

<div class="layout">

    <!-- ─── SIDEBAR ─── -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <span class="sun">☀️</span>
            <h2>BECCA &amp; SUNNY</h2>
            <p>LINE Chat Log</p>
        </div>

        <div class="sidebar-nav" id="sideNav">
            <div class="page-nav">
                <a class="page-link" href="my-sunny.html"><span class="pi">☀️</span> My Sunny</a>
                <a class="page-link" href="sunny-guide.html"><span class="pi">💕</span> Chat Guide</a>
                <a class="page-link active" href="chat.html"><span class="pi">💬</span> Chat Log</a>
            </div>
            <div class="loading" style="height:60px;font-size:12px;">
                <div class="spinner"></div>
            </div>
        </div>

        <div class="sidebar-footer">
            <p>Nov 2025 – Jun 2026<br>💕 Every message saved</p>
        </div>
    </aside>

    <!-- ─── MAIN ─── -->
    <div class="main">
        <div class="topbar">
            <span class="topbar-title">💕 LINE Chat Log</span>
            <div class="search-wrap">
                <input type="text" id="mainSearch" placeholder="Search messages...">
                <span class="search-icon">🔍</span>
            </div>
            <div class="msg-stats" id="msgStats">Loading…</div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="loading">
                <div class="spinner"></div>
                Loading chat log…
            </div>
        </div>
    </div>

</div>

<script>
// ─── PARSER ────────────────────────────────────────────────────────────

function parseChat(text) {
    const lines = text.split('\n');
    const groups = [];
    let cur = null, lastMsg = null;

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (!line.trim()) continue;
        if (line.startsWith('[LINE]') || line.startsWith('儲存日期')) continue;

        // Date line: 2025/11/01（六）
        if (/^\d{4}\/\d{2}\/\d{2}/.test(line)) {
            cur = { dateRaw: line.trim(), messages: [] };
            groups.push(cur);
            lastMsg = null;
            continue;
        }

        // Message line: HH:MM\t...
        if (/^\d{2}:\d{2}\t/.test(line)) {
            const t1 = line.indexOf('\t');
            const t2 = line.indexOf('\t', t1 + 1);
            const time    = line.slice(0, t1);
            const sender  = t2 < 0 ? line.slice(t1 + 1) : line.slice(t1 + 1, t2);
            const content = t2 < 0 ? '' : line.slice(t2 + 1);
            const type    = classifyContent(content);
            lastMsg = { time, sender: sender.trim(), content, type };
            if (cur) cur.messages.push(lastMsg);
        } else if (lastMsg) {
            lastMsg.content += '\n' + line;
        }
    }
    return groups;
}

function classifyContent(c) {
    if (c === '[照片]')  return 'photo';
    if (c === '[影片]')  return 'video';
    if (c === '[貼圖]')  return 'sticker';
    if (c === '[檔案]')  return 'file';
    if (c.startsWith('☎') || c.startsWith('☎')) return 'call';
    if (c.includes('已收回訊息') || c.includes('您已收回訊息')) return 'recalled';
    return 'text';
}

function isBecca(sender) {
    return sender === '詠詠詠';
}

// ─── DATE FORMATTERS ──────────────────────────────────────────────────

const DAY_MAP = { '日':'Sun','一':'Mon','二':'Tue','三':'Wed','四':'Thu','五':'Fri','六':'Sat' };
const MON_SHORT = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_LONG  = ['','January','February','March','April','May','June','July','August','September','October','November','December'];

function parseDateRaw(d) {
    const m = d.match(/(\d{4})\/(\d{2})\/(\d{2})（(.)）/);
    return m ? { y: m[1], mo: parseInt(m[2]), day: parseInt(m[3]), wd: m[4] } : null;
}

function fmtDateFull(d) {
    const p = parseDateRaw(d);
    if (!p) return d;
    return `${MON_SHORT[p.mo]} ${p.day}, ${p.y} · ${DAY_MAP[p.wd] || p.wd}`;
}

function fmtDateShort(d) {
    const p = parseDateRaw(d);
    if (!p) return d;
    return `${MON_SHORT[p.mo]} ${p.day} · ${DAY_MAP[p.wd] || p.wd}`;
}

function getYM(d) {
    const p = parseDateRaw(d);
    return p ? `${p.y}-${String(p.mo).padStart(2,'0')}` : '?';
}

function getYMLabel(d) {
    const p = parseDateRaw(d);
    return p ? `${MON_LONG[p.mo]} ${p.y}` : '?';
}

// ─── CONTENT RENDERER ────────────────────────────────────────────────

function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function linkify(s) {
    return esc(s).replace(/(https?:\/\/[^\s<>"]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function renderContent(msg, query) {
    const ICONS = { photo:'📷 Photo', video:'🎬 Video', sticker:'🎴 Sticker', file:'📎 File' };
    if (['photo','video','sticker','file'].includes(msg.type)) {
        return `<span class="media-chip ${msg.type}">${ICONS[msg.type]}</span>`;
    }
    if (msg.type === 'call') return esc(msg.content);
    if (msg.type === 'recalled') return esc(msg.content) || '已收回訊息';

    let html = linkify(msg.content);
    if (query) {
        const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
        html = html.replace(re, '<mark>$1</mark>');
    }
    return html;
}

// ─── RENDER MESSAGES ─────────────────────────────────────────────────

function renderMessages(groups, query = '') {
    const area = document.getElementById('chatArea');
    const frag = document.createDocumentFragment();
    const ql = query.toLowerCase();
    let total = 0, shown = 0;

    for (const g of groups) {
        const visible = ql
            ? g.messages.filter(m => m.content.toLowerCase().includes(ql) || m.sender.toLowerCase().includes(ql))
            : g.messages;

        total += g.messages.length;
        if (!visible.length) continue;
        shown += visible.length;

        const groupEl = document.createElement('div');
        groupEl.className = 'date-group';
        groupEl.id = 'dg-' + g.dateRaw.replace(/[\/（）\s]/g, '-');

        const sep = document.createElement('div');
        sep.className = 'date-sep';
        sep.innerHTML = `<span>${fmtDateFull(g.dateRaw)}</span>`;
        groupEl.appendChild(sep);

        let prevSender = null;
        for (const msg of visible) {
            const becca = isBecca(msg.sender);
            const grouped = (msg.sender === prevSender) && msg.type !== 'call' && msg.type !== 'recalled';
            prevSender = msg.sender;

            // System messages
            if (msg.type === 'call') {
                const el = document.createElement('div');
                el.className = 'msg-row system';
                el.innerHTML = `<div class="call-pill">📞 ${esc(msg.content)}</div>`;
                groupEl.appendChild(el);
                prevSender = null;
                continue;
            }
            if (msg.type === 'recalled') {
                const el = document.createElement('div');
                el.className = 'msg-row system';
                el.innerHTML = `<div class="recalled-pill">🗑 ${esc(msg.content || '已收回訊息')}</div>`;
                groupEl.appendChild(el);
                prevSender = null;
                continue;
            }

            const row = document.createElement('div');
            row.className = `msg-row ${becca ? 'from-becca' : 'from-sunny'}${grouped ? ' grouped' : ''}`;

            const avClass  = becca ? 'av-becca' : 'av-sunny';
            const avEmoji  = becca ? '✈️' : '☀️';
            const bClass   = becca ? 'b-becca' : 'b-sunny';
            const lbl      = becca ? 'Becca' : 'Sunny';

            row.innerHTML = `
                <div class="avatar ${avClass}">${avEmoji}</div>
                <div class="bw">
                    <div class="sender-lbl">${lbl}</div>
                    <div class="bubble ${bClass}">${renderContent(msg, ql)}</div>
                    <div class="btime">${msg.time}</div>
                </div>`;
            groupEl.appendChild(row);
        }
        frag.appendChild(groupEl);
    }

    area.innerHTML = '';
    if (shown === 0 && query) {
        area.innerHTML = `<div class="empty-msg">No messages found for "<strong>${esc(query)}</strong>"</div>`;
    } else {
        area.appendChild(frag);
    }

    const stats = document.getElementById('msgStats');
    stats.textContent = query ? `${shown} / ${total} messages` : `${total} messages`;
}

// ─── SIDEBAR NAV ─────────────────────────────────────────────────────

function buildSideNav(groups) {
    const nav = document.getElementById('sideNav');
    // keep page-nav at top
    const pageNav = nav.querySelector('.page-nav');
    nav.innerHTML = '';
    nav.appendChild(pageNav);

    const monthMap = new Map();
    for (const g of groups) {
        const key = getYM(g.dateRaw);
        if (!monthMap.has(key)) monthMap.set(key, { label: getYMLabel(g.dateRaw), dates: [] });
        monthMap.get(key).dates.push(g);
    }

    for (const [, { label, dates }] of monthMap) {
        const mEl = document.createElement('div');
        mEl.className = 'month-group';

        const mLabel = document.createElement('div');
        mLabel.className = 'month-label';
        mLabel.innerHTML = `${label} <span class="arrow">▾</span>`;

        const dLinks = document.createElement('div');
        dLinks.className = 'date-links';

        mLabel.addEventListener('click', () => {
            mLabel.classList.toggle('collapsed');
            dLinks.classList.toggle('hidden');
        });

        for (const g of dates) {
            const a = document.createElement('div');
            a.className = 'date-link';
            a.textContent = fmtDateShort(g.dateRaw);
            a.dataset.gid = 'dg-' + g.dateRaw.replace(/[\/（）\s]/g, '-');
            a.addEventListener('click', () => {
                document.querySelectorAll('.date-link').forEach(l => l.classList.remove('active'));
                a.classList.add('active');
                document.getElementById(a.dataset.gid)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
            dLinks.appendChild(a);
        }

        mEl.appendChild(mLabel);
        mEl.appendChild(dLinks);
        nav.appendChild(mEl);
    }
}

// ─── SCROLL SPY ──────────────────────────────────────────────────────

function setupScrollSpy() {
    const obs = new IntersectionObserver(entries => {
        for (const e of entries) {
            if (e.isIntersecting) {
                document.querySelectorAll('.date-link').forEach(l =>
                    l.classList.toggle('active', l.dataset.gid === e.target.id));
            }
        }
    }, { threshold: 0.1, rootMargin: '0px 0px -60% 0px' });
    document.querySelectorAll('.date-group').forEach(el => obs.observe(el));
}

// ─── INIT ────────────────────────────────────────────────────────────

let allGroups = [];

async function init() {
    try {
        const res = await fetch('chat-log.txt');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        allGroups = parseChat(text);
        buildSideNav(allGroups);
        renderMessages(allGroups);
        setTimeout(setupScrollSpy, 200);
    } catch (err) {
        document.getElementById('chatArea').innerHTML =
            `<div class="empty-msg">Could not load chat log.<br><small>${err.message}</small></div>`;
        document.getElementById('msgStats').textContent = 'Error';
    }
}

let searchTimer;
document.getElementById('mainSearch').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => renderMessages(allGroups, e.target.value.trim()), 280);
});

init();
</script>
</body>
</html>
